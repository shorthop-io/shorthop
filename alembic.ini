# Alembic config for dbdeck.
# Migrations run automatically on startup (see app/db.py:init_db); use the CLI for authoring:
#   cd backend/dbdeck && alembic revision --autogenerate -m "describe change"
#   alembic upgrade head        # apply
#   alembic downgrade -1        # roll back one
# The DB URL is taken from the app config/engine in migrations/env.py, not from this file.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
