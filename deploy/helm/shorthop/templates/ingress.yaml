{{- range $kind, $ing := dict "web" .Values.ingress "public" .Values.publicIngress }}
{{- if $ing.enabled }}
{{- if and (eq $kind "public") (not $.Values.public.enabled) }}
{{- fail "publicIngress needs public.enabled=true" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shorthop.fullname" $ }}{{ if eq $kind "public" }}-public{{ end }}
  labels: {{- include "shorthop.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | toString | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required (printf "%s.host is required" (ternary "publicIngress" "ingress" (eq $kind "public"))) $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "shorthop.fullname" $ }}
                port:
                  name: {{ ternary "public" "http" (eq $kind "public") }}
{{- end }}
{{- end }}
