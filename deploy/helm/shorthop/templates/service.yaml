apiVersion: v1
kind: Service
metadata:
  name: {{ include "shorthop.fullname" . }}
  labels: {{- include "shorthop.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "shorthop.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
    {{- if .Values.public.enabled }}
    - { name: public, port: {{ .Values.service.publicPort }}, targetPort: public }
    {{- end }}
