# A release: push a tag vX.Y.Z. Builds the image for amd64 + arm64 and pushes it to
#   ghcr.io/shorthop-io/shorthop:X.Y.Z, :X.Y and :X
# publishes the Helm chart to oci://ghcr.io/shorthop-io/charts/shorthop, and drafts the GitHub
# release. The tag must match deploy/helm/shorthop/Chart.yaml (version and appVersion).
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version: $v$" deploy/helm/shorthop/Chart.yaml || { echo "Chart.yaml version is not $v"; exit 1; }
          grep -q "^appVersion: \"$v\"$" deploy/helm/shorthop/Chart.yaml || { echo "Chart.yaml appVersion is not $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shorthop-io/shorthop:${{ steps.v.outputs.version }}
            ghcr.io/shorthop-io/shorthop:${{ steps.v.outputs.minor }}
            ghcr.io/shorthop-io/shorthop:${{ steps.v.outputs.major }}
          labels: |
            org.opencontainers.image.source=https://github.com/shorthop-io/shorthop
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: azure/setup-helm@v4
      - name: helm chart
        run: |
          helm package deploy/helm/shorthop
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "shorthop-${{ steps.v.outputs.version }}.tgz" oci://ghcr.io/shorthop-io/charts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
